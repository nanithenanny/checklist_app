<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Stock Checklist</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>Weekly Stock Up</h1>
    <div class="row">
      <input id="search" placeholder="Search item…" />
      <select id="filterVendor">
        <option value="">All vendors</option>
      </select>
    </div>
    <div class="row">
      <button id="btnShare">Send to WhatsApp</button>
      <button id="btnReset">Clear all ticks</button>
      <button id="btnExport">Export</button>
      <label class="btnLike">
        Import <input id="importFile" type="file" accept="application/json" hidden />
      </label>
    </div>
  </header>

  <main id="list"></main>

  <footer class="foot">
    <button id="btnAdd">+ Add item</button>
  </footer>

  <dialog id="dlg">
    <form method="dialog" id="itemForm">
      <h3 id="dlgTitle">Add item</h3>

      <label>Item
        <input id="fName" required />
      </label>

      <label>Category
        <input id="fCategory" placeholder="e.g., Cheese / Sauce / Packaging" />
      </label>

      <div class="grid2" style="grid-template-columns: 1fr 1fr 1fr;">
        <label>Qty
          <input id="fQty" type="number" step="0.01" placeholder="e.g., 2" />
        </label>
        <label>Unit
          <input id="fUnit" placeholder="e.g., kg / pcs / bottle" />
        </label>
        <label>Price (RM/unit)
          <input id="fPrice" type="number" step="0.01" placeholder="e.g., 12.50" />
        </label>
      </div>

      <label>Where to buy (vendor/place)
        <input id="fVendor" placeholder="e.g., NSK / Lotus / BakeWithYen / Shopee" />
      </label>

      <label>Notes
        <input id="fNotes" placeholder="Optional" />
      </label>
     
      <menu>
        <button value="cancel">Cancel</button>
        <button id="btnSave" value="default">Save</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script>
    // Register service worker (offline)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
